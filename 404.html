<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERRO 404 | TACCONE</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: #FFFFFF;
            overflow: hidden;
        }

        .container {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #555555; /* Um cinza discreto para o código do erro */
        }

        p {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        a {
            color: #FFFFFF;
            text-decoration: none;
            font-size: 16px;
            border-bottom: 1px solid #990000; /* Linha vermelha característica da Taccone */
            padding-bottom: 5px;
            transition: opacity 0.3s ease;
        }

        a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ERRO 404</h1>
        <p>ACESSAR SITE DA TACCONE:</p>
        <a href="https://www.taccone.com.br">WWW.TACCONE.COM.BR</a>
    </div>

</body>
</html>
